<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<title>Yazboz 101</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE everyday tool for a late-night okey table: calm, quick, a little warmth
   IDEA the okey table itself: a green felt band holding the players' totals as ivory tiles, the paper yazboz grid below
   PICTURE the totals drawn as okey tiles on felt, numbers in each player's tile colour, a gold crown on the leader
   COLOUR felt green band and main action, ivory tiles, tile red/blue/black/amber for players; red ceza, gold ödül
   TYPE Outfit for numerals and titles + Inter for text
   LAYOUT one-screen phone app: felt band (header + tiles), scrolling grid, coloured action bar; centred 620px column on laptops */
:root{color-scheme:light;
--bg:#ebe8e0;--s1:#e0dcd2;--s2:#d2cdc1;--line:#d5d0c5;--ink:#22231f;--mute:#67645b;
--red:#c13a2e;--redbg:#f1dcd5;--green:#17743e;--gold:#946100;--goldbg:#efe0bd;--blue:#2a5bc9;
--felt1:#15805c;--felt2:#0c5640;--pri:#0f6b4f;--cur:#d9e6dc;--tile:#f6f1e4;--tileEdge:#d4cab4;--scrim:rgba(20,22,18,.45)}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;
--bg:#0e1211;--s1:#172019;--s2:#222c27;--line:#29332e;--ink:#eef2ef;--mute:#9aa6a0;
--red:#ff7d70;--redbg:#3a1a17;--green:#5fd896;--gold:#f3c35a;--goldbg:#2e2612;--blue:#86acff;
--felt1:#125a44;--felt2:#0a3226;--pri:#1c9a71;--cur:#14261f;--tile:#f6f0e2;--tileEdge:#cdc4af;--scrim:rgba(0,0,0,.6)}}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default;opacity:.38}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-family:Outfit,Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{height:100%;max-width:620px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}
@media(min-width:660px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
#top{flex:none}
.band{position:relative;z-index:2;color:#fff;border-radius:0 0 24px 24px;padding:calc(8px + env(safe-area-inset-top,0px)) 8px 14px;background:repeating-linear-gradient(135deg,rgba(255,255,255,.028) 0 2px,transparent 2px 7px),radial-gradient(140% 120% at 50% -20%,var(--felt1),var(--felt2));box-shadow:0 8px 22px rgba(6,40,28,.16)}
.hr{display:flex;align-items:center;gap:2px;min-height:48px}
.hl{flex:1;min-width:0;padding:0 6px}
.t1{font:600 24px/1.1 Outfit,Inter,sans-serif;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:13px;color:rgba(255,255,255,.78);display:flex;align-items:center;gap:6px;margin-top:2px;white-space:nowrap;overflow:hidden}
.t2 span:last-child{overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.45);flex:none}
.dot.on{background:#7df0b5;box-shadow:0 0 0 3px rgba(125,240,181,.22)}
.ib{width:42px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.ib:hover:not(:disabled){background:var(--s1)}
.band .ib:hover:not(:disabled){background:rgba(255,255,255,.12)}
.brand{font:700 26px/1 Outfit,sans-serif;letter-spacing:-.02em;display:flex;align-items:center;gap:9px;padding-left:6px}
#main{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px max(16px,env(safe-area-inset-right,0px)) 22px max(16px,env(safe-area-inset-left,0px))}
#bar{flex:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}
#bar.v{grid-template-columns:1fr 1fr 1.45fr 1fr}
#bar:empty{display:none}
.bb{position:relative;height:58px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px;font-weight:600;background:var(--s1);white-space:nowrap}
.bb .ic{width:21px;height:21px}
.bb.pri{background:var(--pri);color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--pri) 32%,transparent)}
.bb.c{background:var(--redbg);color:var(--red)}
.bb.o{background:var(--goldbg);color:var(--gold)}
.bb .cnt{position:absolute;top:6px;right:calc(50% - 24px);min-width:18px;height:18px;border-radius:9px;background:var(--pri);color:#fff;font-size:12px;line-height:18px;padding:0 5px}
.bb:active{transform:scale(.97)}
.tb{flex:none;display:inline-grid;place-items:center;width:22px;height:28px;border-radius:5px;background:var(--tile);color:var(--c);font:700 15px/1 Outfit,sans-serif;box-shadow:inset 0 -2px 0 var(--tileEdge),0 0 0 1px var(--tileEdge)}
.tb.lg{width:34px;height:44px;font-size:22px;border-radius:7px}
.trow{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:10px;padding:14px 8px 2px}
.trow[data-n="5"],.trow[data-n="6"]{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:16px}
.tt{position:relative;background:var(--tile);color:var(--c);border-radius:12px;padding:8px 6px 9px;text-align:center;box-shadow:inset 0 -4px 0 var(--tileEdge),0 8px 18px rgba(0,0,0,.24)}
.tt .nm{display:block;font:600 13px/1.25 Inter,sans-serif;color:#5d5546;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt .v{display:block;font:700 clamp(22px,6.6vw,32px)/1.08 Outfit,sans-serif;letter-spacing:-.02em;margin-top:3px;white-space:nowrap}
.trow[data-n="2"] .v{font-size:clamp(34px,10vw,50px)}
.tt .dt{display:block;width:7px;height:7px;border-radius:50%;background:var(--c);margin:4px auto 2px}
.tt.hid .v{opacity:.32;letter-spacing:.1em}
.tt.top1{box-shadow:inset 0 -4px 0 var(--tileEdge),0 0 0 3px #f2c14e,0 8px 22px rgba(0,0,0,.3)}
.crown{position:absolute;top:-15px;left:50%;transform:translateX(-50%);width:26px;height:20px;color:#f2c14e;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.tt.bump{animation:bump .55s ease-out}
@keyframes bump{30%{transform:translateY(-6px) scale(1.06)}}
.note{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mute);margin:0 0 12px}
.note .ic{width:18px;height:18px}
.over{display:flex;align-items:center;gap:10px;background:var(--goldbg);color:var(--ink);border-radius:16px;padding:10px 12px;margin:0 0 12px}
.over>.ic{color:var(--gold)}
.over b{flex:1}
.over .btn{background:var(--bg)}
.tw{border:1px solid var(--line);border-radius:18px;overflow:hidden}
table.yz{width:100%;border-collapse:collapse;table-layout:fixed}
.yz th{font-size:13px;font-weight:600;padding:9px 2px 8px;background:var(--s1);border-bottom:1px solid var(--line);border-left:1px solid var(--line)}
.yz th>span{display:flex;flex-direction:column;align-items:center;gap:4px}
.yz th .nm{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.yz th.hn,.yz td.hn{width:46px;border-left:0}
.yz td{text-align:center;padding:9px 2px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);vertical-align:middle;height:48px}
.yz td.hn{font-size:13px;font-weight:600;color:var(--mute)}
.yz td.hn span{display:inline-grid;place-items:center;min-width:28px;height:28px;padding:0 4px;border-radius:14px}
.yz tr.cur td{background:var(--cur)}
.yz tr.cur td.hn span{background:var(--pri);color:#fff}
.yz tr.fut td{opacity:.5}
.yz td b{display:block;font:600 17px/1.25 Outfit,sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.yz td[data-act]{cursor:pointer}
.yz tr.ext td{padding:8px;height:auto;background:var(--bg)}
.extb{width:100%;height:42px;border:1.5px dashed var(--line);border-radius:12px;color:var(--mute);font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.extb .ic{width:18px;height:18px}
.extb:hover{border-color:var(--pri);color:var(--pri)}
.yz tr.sum td{background:var(--s1);vertical-align:top;height:44px;padding:7px 2px}
.yz tr.sum td.hn{vertical-align:middle;font-size:13px}
.yz tr.od td.hn{color:var(--gold)}
.yz tr.cz td.hn{color:var(--red)}
.yz tr.first-sum td{border-top:2px solid var(--line)}
.bd{display:inline-block;font:600 13px/1 Outfit,Inter,sans-serif;padding:4px 5px;border-radius:6px;margin:2px 1px;white-space:nowrap}
.bd.c{color:var(--red);background:var(--redbg)}
.bd.o{color:var(--gold);background:var(--goldbg)}
.neg{color:var(--green)}
.rwd{display:inline-flex;align-items:center;font:800 17px/1 Outfit,Inter,sans-serif;letter-spacing:-.04em;color:var(--gold);background:var(--goldbg);border-radius:6px;padding:2px 5px 3px;white-space:nowrap}
.rwd:disabled{opacity:1;cursor:default}
.home{max-width:520px;margin:0 auto}
.hero-art{display:grid;place-items:center;padding:4px 0 0}
.hero-art svg{width:min(300px,78%);height:auto}
.hero p{margin:4px 0 0;text-align:center;color:rgba(255,255,255,.82);font-size:15px}
.resume{background:var(--s1);border-radius:20px;padding:16px;margin:0 0 14px}
.resume b{display:block;font:600 19px/1.2 Outfit,sans-serif}
.resume small{display:block;color:var(--mute);font-size:14px;margin-top:2px}
.rs-names{display:flex;flex-wrap:wrap;gap:8px 14px;margin:12px 0 14px;font-weight:600;font-size:15px}
.rs-names>span{display:inline-flex;align-items:center;gap:6px}
.big-btn{height:58px;font-size:17px}
.mic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--k) 14%,transparent);color:var(--k);flex:none}
.mic .ic{width:20px;height:20px}
.setup{max-width:520px;margin:0 auto}
.lbl{font-size:14px;font-weight:600;color:var(--mute);margin:20px 0 8px}
.lbl:first-child{margin-top:0}
.seg{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));background:var(--s1);border-radius:14px;padding:4px;gap:4px}
.seg button{height:44px;border-radius:11px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.names{display:grid;gap:8px}
.fld{display:flex;align-items:center;gap:10px;height:52px;padding:0 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--bg)}
.fld:focus-within{border-color:var(--pri)}
.fld input{flex:1;border:0;outline:0;background:none;font-size:16px;height:100%}
.minis{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.mini{height:36px;padding:0 12px;border-radius:18px;background:var(--s1);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.mini .ic{width:18px;height:18px}
.step{display:flex;align-items:center;gap:12px}
.step .ib{background:var(--s1);width:52px;height:52px;border-radius:14px}
.step .sv{flex:1;text-align:center;font:600 36px/1 Outfit,sans-serif}
.step .sv span{color:var(--mute);font-size:24px;margin-left:4px}
.hint{font-size:14px;color:var(--mute);margin:8px 0 0;text-align:center}
.tog{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--s1);margin-top:12px}
.tog>div{flex:1}
.tog b{display:block;font-weight:600}
.tog small{display:block;color:var(--mute);font-size:14px}
.sw{width:50px;height:30px;border-radius:15px;background:var(--s2);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.sw.on{background:var(--pri)}
.sw.on::after{transform:translateX(20px)}
.btn{height:52px;border-radius:14px;padding:0 18px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--s1)}
.btn.pri{background:var(--pri);color:#fff}
.btn.red{background:var(--red);color:#fff}
.btn.ghost{background:none;border:1.5px solid var(--line)}
.btn.sm{height:44px;font-size:14px;padding:0 12px}
.btn.wide{width:100%}
.btn .ic{width:20px;height:20px}
.go-start{margin-top:24px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
.state{text-align:center;max-width:420px;margin:8vh auto 0}
.state h2{font:600 26px/1.15 Outfit,sans-serif;margin:16px 0 8px}
.state p{color:var(--mute);margin:0 0 18px}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--s2);border-top-color:var(--pri);margin:0 auto;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#sheetRoot .ov{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:30}
#sheetRoot .ov[hidden]{display:none}
.sh{width:100%;max-width:620px;max-height:94%;background:var(--bg);color:var(--ink);border-radius:22px 22px 0 0;display:flex;flex-direction:column;box-shadow:0 -10px 34px rgba(0,0,0,.2);animation:up .2s ease-out}
.ov.center{align-items:center;padding:16px}
.ov.center .sh{border-radius:20px;max-width:420px}
.sh-h{display:flex;align-items:center;gap:6px;padding:14px 10px 4px 18px;flex:none}
.sh-h h2{font:600 23px/1.15 Outfit,sans-serif;margin:0;flex:1;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-b{overflow-y:auto;padding:6px 18px calc(18px + env(safe-area-inset-bottom,0px))}
@keyframes up{from{transform:translateY(30px);opacity:.5}}
@media(prefers-reduced-motion:reduce){.sh,.spin,.tt.bump{animation:none}}
.lead{font-size:14px;font-weight:600;color:var(--mute);margin:4px 0 8px}
.pills{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:6px}
.pill{border-radius:14px;background:var(--s1);padding:7px 4px 6px;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px}
.pill.on{border-color:var(--pri);background:var(--bg)}
.pill .nm{font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px;max-width:100%}
.pill .nm>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill .tb{width:16px;height:21px;font-size:12px;border-radius:4px}
.pill .pv{font:600 18px/1.15 Outfit,sans-serif;white-space:nowrap}
.pills.many .pv{font-size:15px}
.pill .pl{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;line-height:1.1}
.disp{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:12px 2px 10px}
.disp .lab{color:var(--mute);font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.disp .big{font:600 42px/1 Outfit,sans-serif;letter-spacing:-.02em;white-space:nowrap}
.disp .big.ceza{color:var(--red)}
.disp .big.odul{color:var(--gold)}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:10px}
.chips.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.chips.four{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.chips.four .chip{padding:4px 2px}
.chips.four .l{font-size:11px;white-space:nowrap}
.elsh .chips:not(:last-of-type){margin-bottom:8px}
.chip{min-height:52px;border-radius:14px;border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 6px;line-height:1.15}
.chip:active{background:var(--s1)}
.chip .v{font:600 19px/1.1 Outfit,sans-serif;white-space:nowrap}
.chip .l{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.chip.neg .v{color:var(--green)}
.chip.cz{background:var(--redbg);border-color:transparent}
.chip.cz .v{color:var(--red)}
.chip.od{background:var(--goldbg);border-color:transparent}
.chip.od .v{color:var(--gold)}
.chip.rs{min-height:44px;font-size:14px;font-weight:600}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.kp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kp button{height:52px;border-radius:14px;background:var(--s1);font:600 23px/1 Outfit,sans-serif;display:grid;place-items:center}
.kp button:active{transform:scale(.97);background:var(--s2)}
.kp .fn{font:600 17px/1 Inter,sans-serif;color:var(--mute)}
.kp .go{background:var(--pri);color:#fff;font:600 17px/1 Inter,sans-serif}
.kp .op{color:var(--pri)}
.kp .w2{grid-column:span 2}
.kp .w3{grid-column:span 3}
.save{margin-top:12px;height:56px}
.save .cnt{opacity:.75;font-weight:500}
.sh-b .save{position:sticky;bottom:0;box-shadow:0 0 0 6px var(--bg)}
.save:disabled{opacity:1;background:var(--s2);color:var(--mute)}
@media(max-height:700px){.sh{max-height:100%}.elsh .lead{display:none}.disp{padding:4px 2px 6px}.disp .big{font-size:30px}.kp button{height:44px}.chip{min-height:44px}.tools .btn{height:40px}.sh-b .save{height:50px;margin-top:8px}.sh-h{padding-top:10px}}
.alldone{display:flex;align-items:center;gap:10px;padding:18px 14px;border-radius:14px;background:var(--cur);margin:14px 0 4px;font-weight:600}
.alldone .ic{color:var(--pri)}
.claims{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.claim{height:40px;padding:0 12px;border-radius:12px;background:color-mix(in srgb,var(--blue) 13%,transparent);color:var(--blue);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.claim .ic{width:18px;height:18px}
.whog{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.whob{min-height:72px;border-radius:16px;background:var(--s1);display:flex;align-items:center;gap:12px;padding:10px 14px;font-weight:600;font-size:17px;text-align:left}
.whob>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px 0 8px;border-radius:12px;background:var(--s1);margin-bottom:12px;max-width:100%}
.back b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back small{color:var(--mute);font-size:13px}
.link{color:var(--pri);font-weight:600;font-size:14px;height:40px;margin:-4px 0 4px}
.recs{display:grid;gap:6px}
.rgh{font-size:14px;font-weight:600;color:var(--mute);margin:14px 0 4px}
.rec{display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 10px;border-radius:14px;background:var(--s1);text-align:left;width:100%}
.rec .rn{flex:1;min-width:0;font-weight:600;overflow:hidden}
.rec .rn small{display:block;font-weight:400;font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .rv{font:600 19px Outfit,sans-serif;white-space:nowrap}
.rv.c{color:var(--red)}
.rv.o{color:var(--gold)}
.rv.g{color:var(--green)}
.empty{color:var(--mute);text-align:center;padding:24px 0}
.rank{display:grid;gap:8px;margin-top:4px}
.rk{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--s1)}
.rk.first{background:var(--pri);color:#fff}
.rk .n{font:600 17px Outfit,sans-serif;width:20px;opacity:.7}
.rk b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .v{font:600 24px Outfit,sans-serif;white-space:nowrap}
.rk small{display:block;font-size:13px;opacity:.8;font-weight:500}

function gameView(g, admin) {

const unfinished = () => game && !game.sample && !isOver(game) && game.entries.length > 0;
async function startGame() {

function toggleEye() {

function addExtra() {

  const add = hide => { mutate(g => { g.extra = (g.extra || 0) + 1; if (g.done >= g.base) g.reHide = !!hide; }); toast(hide ? 'Uzatma eli eklendi, toplamlar gizlendi' : 'Uzatma eli eklendi', undo); };

}

/* ---------- paneller ---------- */
const sheets = [];
function openSheet({title = '', center = false, onClose = null} = {}) {
  const ov = document.createElement('div');
  ov.className = 'ov' + (center ? ' center' : '');
  ov.innerHTML = `<div class="sh" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sh-h"><h2>${esc(title)}</h2><span class="hx"></span><button class="ib" data-x aria-label="Kapat">${ic('x')}</button></div><div class="sh-b"></div></div>`;
  const s = {ov, body: ov.querySelector('.sh-b'), hx: ov.querySelector('.hx'), title: t => { ov.querySelector('h2').textContent = t; }, onClose, redraw: null};
  ov.addEventListener('click', e => { if (e.target === ov || e.target.closest('[data-x]')) closeSheet(s); });
  if (sheets.length) sheets[sheets.length - 1].ov.hidden = true;
  $('#sheetRoot').append(ov);
  sheets.push(s);
  document.body.classList.add('has-sheet');
  navSync();
  return s;
}
function closeSheet(s = sheets[sheets.length - 1]) {
  const i = sheets.indexOf(s);
  if (i < 0) return;
  sheets.splice(i, 1); s.ov.remove();
  const f = s.onClose; s.onClose = null; if (f) f();
  if (sheets.length) sheets[sheets.length - 1].ov.hidden = false;
  document.body.classList.toggle('has-sheet', sheets.length > 0);
  navSync();
}
function closeAll() { while (sheets.length) closeSheet(); }
function refreshSheets() { sheets.forEach(s => { if (s.redraw) s.redraw(); }); }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheets.length) closeSheet(); });

function ask(title, text, okLabel = 'Tamam', danger = false) {
  return new Promise(res => {
    const s = openSheet({title, center: true, onClose: () => res(false)});
    s.body.innerHTML = `<p style="margin:4px 0 0">${esc(text)}</p><div class="row2"><button class="btn" data-a="no">Vazgeç</button><button class="btn ${danger ? 'red' : 'pri'}" data-a="yes">${esc(okLabel)}</button></div>`;
    s.body.addEventListener('click', e => {
      const a = e.target.closest('[data-a]')?.dataset.a;
      if (a === 'yes') { s.onClose = null; closeSheet(s); res(true); }
      else if (a === 'no') closeSheet(s);
    });
  });
}
let toastT = null;
function toast(msg, undoFn) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>${undoFn ? '<button type="button">Geri al</button>' : ''}`;
  t.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('on'), 3800);
  if (undoFn) t.querySelector('button').onclick = () => { t.classList.remove('on'); undoFn(); };
}

function kpHTML({go = 'Sonraki', sign = true} = {}) {
  const d = n => `<button data-k="${n}">${n}</button>`;
  return `<div class="kp">${d(1)}${d(2)}${d(3)}<button class="fn" data-k="bs" aria-label="Sil">${ic('back')}</button>
    ${d(4)}${d(5)}${d(6)}${sign ? '<button class="fn" data-k="pm" aria-label="Artı eksi" style="font-size:22px">±</button>' : '<button class="fn" data-k="cl">C</button>'}
    ${d(7)}${d(8)}${d(9)}<button class="fn" data-k="x2">×2</button>
    <button class="w2" data-k="0">0</button><button class="go w2" data-k="go">${esc(go)}</button></div>`;
}
function kpApply(st, k) {
  if (st.fresh && /^\d$/.test(k)) { st.buf = ''; st.neg = false; }
  st.fresh = false;
  if (/^\d$/.test(k)) { if (st.buf.length < 5) st.buf = (st.buf === '0' ? '' : st.buf) + k; return 'n'; }
  if (k === 'bs') { if (st.buf) st.buf = st.buf.slice(0, -1); else st.neg = false; return 'n'; }
  if (k === 'cl') { st.buf = ''; st.neg = false; return 'n'; }
  if (k === 'pm') { st.neg = !st.neg; return 'n'; }
  if (k === 'x2') { const v = parseInt(st.buf || '0', 10) * 2; st.buf = v ? String(Math.min(v, 99999)) : ''; return 'n'; }
  return k;
}
const kpVal = st => st.buf === '' ? null : (st.neg ? -1 : 1) * parseInt(st.buf, 10);
const kpShow = (st, fb) => st.buf === '' && st.neg ? '−' : st.buf !== '' ? fmt(kpVal(st)) : fb == null ? '0' : fmt(fb);

/* ---------- El gir ---------- */
function openEl() {
  if (!game) return;
  if (isOver(game)) { toast('Oyun bitti. Uzatma eli ekleyebilirsin.'); openResults(); return; }
  const g = game, n = g.sides.length, h = curHand(g);
  const st = {vals: Array(n).fill(null), labs: Array(n).fill(''), act: 0, buf: '', neg: false};
  const s = openSheet({title: handTitle(g, h) + ' · el gir'});
  s.ov.querySelector('.sh').classList.add('elsh');
  const cur = () => st.buf !== '' ? kpVal(st) : st.vals[st.act];
  const commit = () => { if (st.act >= 0 && st.buf !== '') { st.vals[st.act] = kpVal(st); st.labs[st.act] = ''; } st.buf = ''; st.neg = false; };
  const advance = () => { let j = -1; for (let k = 1; k <= n; k++) { const i = (st.act + k) % n; if (st.vals[i] == null) { j = i; break; } } st.act = j; };
  const setVal = v => { st.buf = v ? String(Math.abs(v)) : ''; st.neg = v < 0; };
  function draw() {
    const filled = st.vals.filter((v, i) => v != null || (i === st.act && st.buf !== '')).length;
    const sc = elShortcuts(fixVals(g.vals), g.mode === 'esli');
    const cl = st.act >= 0 ? claimsFor(st.act) : [];
    s.body.innerHTML = `<p class="lead">Kime?</p>
      <div class="pills ${n > 4 ? 'many' : ''}" style="--n:${n}">${g.sides.map((x, i) => { const live = i === st.act && (st.buf !== '' || st.neg); const v = i === st.act && st.buf !== '' ? kpVal(st) : st.vals[i];
        return `<button class="pill ${i === st.act ? 'on' : ''}" data-a="pick" data-i="${i}"><span class="nm">${tb(g, i)}<span>${esc(sideName(g, i))}</span></span><span class="pv num ${v < 0 || (live && st.neg) ? 'neg' : ''}">${live ? kpShow(st) : v == null ? '—' : fmt(v)}</span>${st.labs[i] ? `<span class="pl">${esc(/açmadı$/i.test(st.labs[i]) ? st.labs[i].toLocaleLowerCase('tr') : st.labs[i])}</span>` : ''}</button>`; }).join('')}</div>
      ${st.act >= 0 ? `<div class="disp"><span class="lab">${esc(sideName(g, st.act))}</span><span class="big num ${cur() < 0 || st.neg ? 'neg' : ''}">${kpShow(st, st.vals[st.act])}</span></div>
        ${cl.length ? `<div class="claims">${cl.map(v => `<button class="claim" data-a="claim" data-v="${v}">${ic('phone')}Telefondan: <span class="num">${fmt(v)}</span></button>`).join('')}</div>` : ''}
        ${[sc.map((r, i) => [r, i]).filter(([r]) => r.v > 0), sc.map((r, i) => [r, i]).filter(([r]) => r.v <= 0)].map(grp => `<div class="chips ${grp.length === 4 ? 'four' : ''}">${grp.map(([r, i]) => `<button class="chip ${r.v < 0 ? 'neg' : ''}" data-a="sc" data-i="${i}"><span class="v num">${fmt(r.v)}</span><span class="l">${esc(r.l)}</span></button>`).join('')}</div>`).join('')}
        <div class="tools"><button class="btn sm" data-a="calc">${ic('calc')}Hesap</button><button class="btn sm" data-a="count">${ic('camera')}Fotoğrafla say</button></div>
        ${kpHTML({go: 'Sonraki'})}`
      : `<div class="alldone">${ic('check')}Herkes girildi. Kontrol edip kaydet.</div>`}
      <button class="btn pri wide save" data-a="save" ${filled ? '' : 'disabled'}>Eli kaydet <span class="cnt num">${filled}/${n}</span></button>`;
  }
  s.redraw = draw; s.peerRedraw = draw;
  s.body.addEventListener('click', async e => {
    const b = e.target.closest('[data-a],[data-k]');
    if (!b || b.disabled) return;
    const a = b.dataset.a, k = b.dataset.k;
    if (a === 'pick') { commit(); st.act = +b.dataset.i; const v = st.vals[st.act]; if (v != null) { setVal(v); st.fresh = true; } draw(); return; }
    if (a === 'sc') { if (st.act < 0) return; const r = elShortcuts(fixVals(g.vals), g.mode === 'esli')[+b.dataset.i]; st.vals[st.act] = r.v; st.labs[st.act] = r.n; st.buf = ''; st.neg = false; advance(); draw(); return; }
    if (a === 'claim') { const nv = (cur() || 0) + Number(b.dataset.v); setVal(nv); st.fresh = false; draw(); return; }
    if (a === 'calc') { openCalc({start: cur(), onUse: v => { setVal(v); st.fresh = false; draw(); }}); return; }
    if (a === 'count') { openCount({onUse: v => { setVal(v); st.fresh = false; draw(); }}); return; }
    if (k) {
      if (st.act < 0) return;
      if (k === 'x2' && st.buf === '' && st.vals[st.act] != null) setVal(st.vals[st.act]);
      const r = kpApply(st, k);
      if (r === 'go') { commit(); advance(); }
      draw(); return;
    }
    if (a === 'save') {
      commit();
      const empty = st.vals.filter(v => v == null).length;
      if (empty) { const ok = await ask('Boş kalanlar var', `${empty} ${g.mode === 'esli' ? 'takıma' : 'oyuncuya'} değer girilmedi. 0 yazılsın mı?`, '0 yaz ve kaydet'); if (!ok) { draw(); return; } }
      const vals = st.vals.slice(), labs = st.labs.slice();
      closeSheet(s);
      mutate(gg => { gg.sides.forEach((x, i) => gg.entries.push({id: uid(), k: 'el', s: i, h, v: vals[i] ?? 0, l: labs[i] || ''})); gg.done = Math.max(gg.done, h); });
      if (isOver(game)) celebrate(game, () => openResults());
      else if (game.hide && !game.reHide && game.done === game.base) toast('Toplamlar açıldı. Sıra son elde!', undo);
      else toast(`${handTitle(game, h)} kaydedildi`, undo);
    }
  });
  draw();
}

/* ---------- Ceza / Rekor ---------- */
function openPen(kind) {
  if (!game) return;
  const g = game, n = g.sides.length;
  const st = {side: null, buf: '', neg: false, why: false};
  const T = kind === 'ceza' ? 'Ceza yaz' : 'Rekor yaz';
  const s = openSheet({title: T});
  const signed = v => kind === 'ceza' ? Math.abs(v) : -Math.abs(v);
  function draw() {
    if (st.side == null) {
      s.body.innerHTML = `<p class="lead">Kime?</p><div class="whog">${g.sides.map((x, i) => `<button class="whob" data-a="side" data-i="${i}">${tb(g, i, 'lg')}<span>${esc(sideName(g, i))}</span></button>`).join('')}</div>${kind === 'odul' ? `<p class="fine">Rekorlar tabloda oyuncunun ya da takımın adının yanında <b style="color:var(--gold)">+</b> olarak görünür. Her rekor bir artı.</p>` : '<p class="fine">Cezalar tablonun en altındaki Ceza satırında görünür.</p>'}`;

    }

    const chips = kind === 'ceza'
      ? `<div class="chips two"><button class="chip cz" data-a="pre" data-v="${v.ceza}" data-l="Ceza"><span class="v num">${fmtS(v.ceza)}</span><span class="l">Ceza</span></button><button class="chip" data-a="why"><span class="v" style="font-size:16px">${st.why ? 'Sebebi gizle' : 'Sebebiyle yaz'}</span><span class="l">isteğe bağlı</span></button></div>
         ${st.why ? `<div class="chips two">${CEZA_REASONS.map(r => `<button class="chip rs" data-a="pre" data-v="${v.ceza}" data-l="${esc(r)}">${esc(r)}</button>`).join('')}</div>` : ''}`
      : `<div class="chips two"><button class="chip od" data-a="pre" data-v="${v.rekor.v}" data-l="Rekor"><span class="v num">${fmt(v.rekor.v)}</span><span class="l">Rekor · ${v.rekor.sayi}+ / ${v.rekor.cift} çift</span></button><button class="chip od" data-a="pre" data-v="${v.ciftrekor.v}" data-l="Çift rekor"><span class="v num">${fmt(v.ciftrekor.v)}</span><span class="l">Çift rekor · ${v.ciftrekor.sayi}+ / ${v.ciftrekor.cift} çift</span></button></div>`;
    s.body.innerHTML = `<button class="back" data-a="reside">${tb(g, st.side)}<b>${esc(sideName(g, st.side))}</b><small>değiştir</small></button>${chips}
      <div class="disp"><span class="lab">Başka değer</span><span class="big num ${kv == null ? '' : kind}" ${kv == null ? 'style="color:var(--mute)"' : ''}>${kv == null ? '0' : fmtS(signed(kv))}</span></div>
      ${kpHTML({go: 'Ekle', sign: false})}
      <p class="fine">${kind === 'odul' ? 'Rekor, tabloda adın yanında + olarak görünür.' : 'Cezalar tablonun en altındaki Ceza satırında görünür.'}</p>`;
  }
  function add(v, label) {
    const side = st.side;
    closeSheet(s);
    mutate(gg => gg.entries.push({id: uid(), k: kind, s: side, h: penHand(gg), v, l: label}));
    toast(`${sideName(game, side)}: ${fmtS(v)} ${label.toLocaleLowerCase('tr')}`, undo);
  }
  s.body.addEventListener('click', e => {
    const b = e.target.closest('[data-a],[data-k]');
    if (!b) return;
    const a = b.dataset.a, k = b.dataset.k;
    if (a === 'side') { st.side = +b.dataset.i; s.title(`${sideName(g, st.side)} · ${kind === 'ceza' ? 'ceza' : 'rekor'}`); draw(); return; }
    if (a === 'reside') { st.side = null; s.title(T); draw(); return; }
    if (a === 'why') { st.why = !st.why; draw(); return; }
    if (a === 'pre') { add(signed(Number(b.dataset.v)), b.dataset.l); return; }
    if (k) { const r = kpApply(st, k); if (r === 'go') { const v = kpVal(st); if (v) add(signed(v), kind === 'ceza' ? 'Ceza' : 'Rekor'); else toast('Önce bir değer yaz'); return; } draw(); }
  });

}

/* ---------- Düzelt ---------- */
const kindLabel = k => k === 'el' ? 'El' : k === 'ceza' ? 'Ceza' : 'Rekor';
function openRecords(filter = null) {
  if (!game) return;
  const s = openSheet({title: 'Düzelt'});
  const st = {edit: null, buf: '', neg: false, side: 0, fresh: false, filter};
  const match = e => !st.filter || ((st.filter.h == null || e.h === st.filter.h) && (st.filter.s == null || e.s === st.filter.s) && (!st.filter.k || e.k === st.filter.k));
  function openEdit(id) {
    const e = game.entries.find(x => x.id === id); if (!e) return;
    st.edit = id; st.buf = String(Math.abs(e.v)); st.neg = e.v < 0; st.side = e.s; st.fresh = true;
    s.title('Kaydı düzelt'); draw();
  }
  function draw() {
    const g = game;
    if (st.edit) {
      const e = g.entries.find(x => x.id === st.edit);
      if (!e) { st.edit = null; draw(); return; }
      const v = kpVal(st);
      s.body.innerHTML = `<p class="lead">${esc(handTitle(g, e.h))} · ${kindLabel(e.k)}${e.l ? ' · ' + esc(e.l) : ''}</p>
        <div class="pills" style="--n:${g.sides.length}">${g.sides.map((x, i) => `<button class="pill ${i === st.side ? 'on' : ''}" data-a="eside" data-i="${i}"><span class="nm">${tb(g, i)}<span>${esc(sideName(g, i))}</span></span></button>`).join('')}</div>
        <div class="disp"><span class="lab">Yeni değer</span><span class="big num ${(v != null && v < 0) || st.neg ? 'neg' : ''}">${kpShow(st)}</span></div>
        ${kpHTML({go: 'Kaydet'})}
        <div class="row2"><button class="btn ghost" data-a="list">Listeye dön</button><button class="btn" data-a="del" style="color:var(--red)">${ic('trash')}Sil</button></div>`;
      return;
    }
    const es = g.entries.filter(match);
    const hs = [...new Set(es.map(e => e.h))].sort((a, b) => b - a);
    const f = st.filter;
    s.title(!f ? 'Düzelt' : f.k === 'el' ? `${handTitle(g, f.h)} · ${sideName(g, f.s)}` : `${sideName(g, f.s)} · ${f.k === 'ceza' ? 'cezalar' : 'rekorlar'}`);
    s.body.innerHTML = (hs.length ? hs.map(h => `<div class="rgh">${esc(handTitle(g, h))}</div><div class="recs">${es.filter(e => e.h === h).map(e => `<button class="rec" data-a="open" data-id="${e.id}">${tb(g, e.s)}<span class="rn">${esc(sideName(g, e.s))}<small>${kindLabel(e.k)}${e.l ? ' · ' + esc(e.l) : ''}</small></span><span class="rv num ${e.k === 'ceza' ? 'c' : e.k === 'odul' ? 'o' : e.v < 0 ? 'g' : ''}">${e.k === 'el' ? fmt(e.v) : fmtS(e.v)}</span>${ic('chev')}</button>`).join('')}</div>`).join('')
      : `<p class="empty">${f ? 'Burada kayıt yok.' : 'Henüz kayıt yok. El, ceza ve rekorlar burada listelenir.'}</p>`)
      + (f ? `<div class="row2"><button class="btn ghost" data-a="allrec" style="grid-column:span 2">Tüm kayıtlar</button></div>` : '');
  }
  s.redraw = draw;
  s.body.addEventListener('click', async e => {
    const b = e.target.closest('[data-a],[data-k]');
    if (!b) return;
    const a = b.dataset.a, k = b.dataset.k;
    if (a === 'open') { openEdit(b.dataset.id); return; }
    if (a === 'allrec') { st.filter = null; draw(); return; }
    if (a === 'list') { st.edit = null; draw(); return; }
    if (a === 'eside') { st.side = +b.dataset.i; draw(); return; }
    if (a === 'del') {
      const id = st.edit;
      if (!(await ask('Kayıt silinsin mi?', 'Bu kayıt toplamdan çıkarılır. Geri al ile dönebilirsin.', 'Sil', true))) return;
      mutate(g => { g.entries = g.entries.filter(x => x.id !== id); });
      st.edit = null; draw(); toast('Kayıt silindi', undo); return;
    }
    if (k && st.edit) {
      const r = kpApply(st, k);
      if (r === 'go') {
        const id = st.edit, side = st.side;
        const x0 = game.entries.find(y => y.id === id);
        let v = kpVal(st) ?? 0;
        if (x0 && x0.k === 'ceza') v = Math.abs(v); else if (x0 && x0.k === 'odul') v = -Math.abs(v);
        st.edit = null;
        mutate(g => { const x = g.entries.find(y => y.id === id); if (x) { x.v = v; x.s = side; } });
        draw(); toast('Düzeltildi', undo); return;
      }
      draw();
    }
  });
  if (filter) {
    const es = game.entries.filter(match);
    if (es.length === 1) { openEdit(es[0].id); return; }
  }
  draw();
}

function scoreText() {
  const g = G(); if (!g) return '';
  const t = totals(g), vis = showTotals(g);
  const order = g.sides.map((x, i) => i).sort((a, b) => t[a] - t[b]);
  return `Yazboz 101 · Masa ${g.code} · ${g.done}/${totalHands(g)} el\n` + (vis ? order.map((i, r) => `${r + 1}. ${sideName(g, i)}: ${fmt(t[i])}`).join('\n') : 'Toplamlar şimdilik gizli.');

function copyText(text, where) {
  const done = () => toast('Kopyalandı');
  const fail = () => { if (!where.querySelector('textarea.cp')) { const ta = document.createElement('textarea'); ta.className = 'cp'; ta.readOnly = true; ta.value = text; where.append(ta); ta.select(); } toast('Metni seçip kopyalayabilirsin'); };
  try { navigator.clipboard.writeText(text).then(done, fail); } catch (e) { fail(); }
}

/* ---------- Paylaş ---------- */
const joinURL = code => cap.fb ? (siteBase() ? `${siteBase()}/m/${code.toLowerCase()}` : '') : APP_URL ? `${APP_URL}#masa-${code.toLowerCase()}` : '';
function qrSVG(text) {
  try {
    const q = new QRLib.QRCode(-1, QRLib.EC.M); q.addData(text); q.make();
    const n = q.getModuleCount(), m = 4, S = n + 2 * m; let d = '';
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c + m} ${r + m}h1v1h-1z`;
    return `<svg class="qr" viewBox="0 0 ${S} ${S}" shape-rendering="crispEdges" role="img" aria-label="Masa QR kodu"><rect width="${S}" height="${S}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  } catch (e) { return ''; }
}
function openShare() {
  if (!game) return;
  const s = openSheet({title: 'Masayı paylaş'});
  function draw() {
    if (NATIVE && !cap.fb) { s.body.innerHTML = `<p style="margin-top:0">QR ile canlı izleme için internet bağlantısı gerekiyor. Bağlanana kadar skoru kopyalayıp WhatsApp’tan gönderebilirsin.</p><div class="row2"><button class="btn pri" data-a="live">${ic('qr')}Bağlan</button><button class="btn" data-a="text">${ic('copy')}Skoru kopyala</button></div>`; return; }
    const url = joinURL(game.code), liveOn = !!cap.db && !!url;
    const ps = peers.map(p => { const me = p.presence && Number.isInteger(p.presence.me) ? p.presence.me : null; return `<div class="peer">${me != null && game.sides[me] ? tb(game, me) : ic('user')}<span>${me != null && game.sides[me] ? esc(sideName(game, me)) + ' olarak izliyor' : 'İzleyici'}${p.guest ? ' · misafir' : ''}</span></div>`; }).join('');
    s.body.innerHTML = `<div class="qrbox">${liveOn ? qrSVG(url) : `<div class="qr-off">${cap.ready ? 'Canlı paylaşım bu görünümde kapalı' : 'Bağlantı hazırlanıyor…'}</div>`}</div>
      <div class="code num">${esc(game.code)}</div><p class="cen mut" style="margin:0">Masa kodu</p>
      <p>${liveOn ? (cap.fb ? 'Masadakiler QR’ı telefon kamerasıyla okutsun. Uygulaması olanlarda uygulama, olmayanlarda tarayıcı açılır; skoru canlı görür, hesap makinesi ve fotoğrafla saymayı kullanırlar. Puanı yalnızca sen yazarsın.' : 'Masadakiler QR’ı telefon kamerasıyla okutsun. Skoru canlı görür, hesap makinesi ve fotoğrafla saymayı kullanırlar. Puanı yalnızca sen yazarsın.') : 'Canlı paylaşım için bu sayfanın Claude’da, oturum açılmış bir tarayıcıda açık olması gerekiyor. Skor bu cihazda tutulmaya devam eder.'}</p>
      <div class="row2"><button class="btn sm" data-a="link" ${url ? '' : 'disabled'}>${ic('link')}Linki kopyala</button><button class="btn sm" data-a="text">${ic('copy')}Skoru kopyala</button></div>
      <div class="peers"><b>Katılanlar${peers.length ? ` (${peers.length})` : ''}</b>${ps || `<span class="mut">${cap.room ? 'Henüz kimse katılmadı.' : 'Katılanlar listesi bu görünümde kapalı.'}</span>`}</div>
      ${cap.fb ? '' : '<p class="fine">İzleyenlerin bu sayfayı açabilmesi için sayfayı Claude’daki Paylaş menüsünden paylaşman gerekir.</p>'}`;
  }
  s.redraw = draw; s.peerRedraw = draw;
  s.body.addEventListener('click', e => {
    const a = e.target.closest('[data-a]')?.dataset.a;
    if (a === 'link') copyText(joinURL(game.code), s.body);
    if (a === 'text') copyText(scoreText(), s.body);
    if (a === 'new') { closeAll(); setup = freshSetup(); view = 'setup'; render(); }

/* ---------- Kendi sunucumuz: Firebase Realtime Database (site ve telefon uygulaması) ----------
   SDK yüklemeden REST ile çalışır: yazma PUT, canlı izleme EventSource (Server-Sent Events), giriş anonim.
   Ayarlar config.js'ten gelir; telefon uygulaması gerekirse siteden indirir (Ayarlar > Canlı paylaşım). */
let CFG = null, FB = null, pendingSite = null;
const cfgOK = c => !!(c && c.firebase && c.firebase.apiKey && c.firebase.databaseURL);
function loadConfig() {
  if (window.YAZBOZ_CONFIG) return Promise.resolve(window.YAZBOZ_CONFIG);
  return new Promise(res => {
    const sc = document.createElement('script');
    sc.src = (/^https?:$/.test(location.protocol) ? '/' : '') + 'config.js';
    sc.onload = () => res(window.YAZBOZ_CONFIG || null); sc.onerror = () => res(null);
    document.head.append(sc);
  });
}
async function fetchSiteConfig(site) {
  let u = String(site || '').trim();
  if (!u) throw {code: 'empty'};
  if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
  u = u.replace(/\/+$/, '');
  const r = await fetch(u + '/config.js', {cache: 'no-store'});
  if (!r.ok) throw {code: 'http'};
  const t = await r.text(), a = t.indexOf('{'), b = t.lastIndexOf('}');
  const c = JSON.parse(t.slice(a, b + 1));
  if (!cfgOK(c)) throw {code: 'cfg'};
  if (!c.siteUrl) c.siteUrl = u;
  LS.set('yb.cfg', c);
  return c;
}
function makeFB(c) {
  const key = c.firebase.apiKey, base = c.firebase.databaseURL.replace(/\/+$/, '');
  const AUTH = c.firebase.authURL || 'https://identitytoolkit.googleapis.com/v1', TOK = c.firebase.tokenURL || 'https://securetoken.googleapis.com/v1';
  let au = LS.get('yb.fbauth', null);
  if (au && au.base !== base) au = null;
  let pend = null;
  async function token() {
    if (au && au.it && au.exp > Date.now() + 60000) return au.it;
    if (pend) return pend;
    pend = (async () => {
      if (au && au.rt) {
        const r = await fetch(`${TOK}/token?key=${encodeURIComponent(key)}`, {method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'}, body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(au.rt)});
        if (r.ok) { const j = await r.json(); au = {base, uid: j.user_id, rt: j.refresh_token, it: j.id_token, exp: Date.now() + (+j.expires_in || 3600) * 1000}; LS.set('yb.fbauth', au); return au.it; }
        if (r.status !== 400) throw {code: 'net'};
      }
      const r = await fetch(`${AUTH}/accounts:signUp?key=${encodeURIComponent(key)}`, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: '{"returnSecureToken":true}'});

function calcEval(ex) {
  const toks = String(ex).replace(/−/g, '-').match(/\d+(?:\.\d+)?|[+\-×÷]/g);
  if (!toks) return null;
  const out = [], ops = [];
  let i = 0, sign = 1;
  while (toks[i] === '-' || toks[i] === '+') { if (toks[i] === '-') sign = -sign; i++; }
  if (i >= toks.length || !/\d/.test(toks[i])) return null;
  out.push(sign * parseFloat(toks[i++]));
  while (i < toks.length) {
    const op = toks[i++]; if (i >= toks.length) break;
    let sg = 1; while (toks[i] === '-' || toks[i] === '+') { if (toks[i] === '-') sg = -sg; i++; }
    if (i >= toks.length || !/\d/.test(toks[i])) break;
    const v = sg * parseFloat(toks[i++]);
    if (op === '×' || op === '÷') { const a = out.pop(); out.push(op === '×' ? a * v : (v === 0 ? NaN : a / v)); }
    else { ops.push(op); out.push(v); }
  }
  let r = out[0];
  for (let j = 0; j < ops.length; j++) r = ops[j] === '+' ? r + out[j + 1] : r - out[j + 1];
  return Number.isFinite(r) ? Math.round(r * 100) / 100 : null;
}
function openCalc({start = null, onUse = null} = {}) {

        <button data-c="7">7</button><button data-c="8">8</button><button data-c="9">9</button><button class="op" data-c="×">×</button>
        <button data-c="4">4</button><button data-c="5">5</button><button data-c="6">6</button><button class="op" data-c="−">−</button>
        <button data-c="1">1</button><button data-c="2">2</button><button data-c="3">3</button><button class="op" data-c="+">+</button>

async function photoCanvas(file, max = 1600) {
  let src = null;
  try { src = await createImageBitmap(file, {imageOrientation: 'from-image'}); }
  catch (e) {
    src = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); });
  }
  const W = src.width || src.naturalWidth, H = src.height || src.naturalHeight, sc = Math.min(1, max / Math.max(W, H));
  const c = document.createElement('canvas'); c.width = Math.round(W * sc); c.height = Math.round(H * sc);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return c;
}

    } catch (e) { if (!stop) { st.err = true; st.msg = failMsg(e); } }
    tessProg = null; st.busy = false; st.ctl = null; draw();
  }
  async function runClaude(file) {
    resetScan(); st.busy = true; st.prog = 'Taşlar okunuyor. 10–30 saniye sürebilir.'; draw();
    st.ctl = new AbortController();
    try {
      const blob = await shrink(file);
      const data = await cap.sample.json(COUNT_PROMPT, {images: [blob], modelTier: 'default', signal: st.ctl.signal});
      const list = Array.isArray(data && data.taslar) ? data.taslar : [];
      st.man = list.map(t => ({n: Math.round(Number(t.n)), r: String(t.r || '').toLowerCase().replace('ı', 'i'), emin: t.emin !== false})).filter(t => t.n >= 1 && t.n <= 13);
      st.vS = Math.max(0, Math.min(2, Math.round(Number(data && data.sahte) || 0)));
      summary(); if (!st.man.length && st.vS) { st.err = false; st.msg = ''; }
      needOkey();
    } catch (e) {
      const c = e && e.code;
      st.err = c !== 'cancelled';
      st.msg = c === 'cancelled' ? '' : c === 'not_granted' || c === 'sampling_disabled' ? 'Claude kullanımına izin verilmedi. Taşlara dokunarak sayabilirsin.'
        : c === 'rate_limited' ? 'Çok sık denendi. Biraz sonra tekrar dene.' : c === 'image_rejected' ? 'Bu fotoğraf okunamadı. Başka bir fotoğraf dene.'
        : 'Fotoğraf okunamadı. Tekrar dene ya da taşlara dokunarak say.';
    }
    st.busy = false; st.ctl = null; draw();
  }
  function pickFile(capture, run) {
    const inp = $('#photo');
    inp.value = '';
    inp.accept = eng === 'claude' && cap.imgTypes ? cap.imgTypes.join(',') : 'image/*';
    if (capture) inp.setAttribute('capture', 'environment'); else inp.removeAttribute('capture');
    inp.onchange = () => { const f = inp.files && inp.files[0]; if (f) run(f); };
    inp.click();
  }
  s.body.addEventListener('click', e => {
    const b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
    const a = b.dataset.a, bx = st.sel != null ? st.boxes[st.sel] : null;
    if (a === 'mult') st.mult = +b.dataset.m;
    else if (a === 'add') { if (tiles().length < 30) st.man.push({n: +b.dataset.n, r: '', emin: true}); }
    else if (a === 'rm') {
      const t = tiles()[+b.dataset.i]; if (!t) return;
      if (t.box != null) st.boxes[t.box].on = false; else if (t.man != null) st.man.splice(t.man, 1); else if (t.v) st.vS = Math.max(0, st.vS - 1);
      st.last = t;
    }
    else if (a === 'unrm') { const t = st.last; if (t) { if (t.box != null) st.boxes[t.box].on = true; else if (t.v) st.vS++; else st.man.push({n: t.n, r: t.r || '', emin: t.emin}); st.last = null; } }
    else if (a === 'box') { const i = +b.dataset.i; st.sel = st.sel === i ? null : i; }
    else if (a === 'unsel') st.sel = null;
    else if (a === 'setn' && bx) { Object.assign(bx, {n: +b.dataset.n, sahte: false, on: true, emin: true}); st.sel = null; summary(); }
    else if (a === 'setsahte' && bx) { Object.assign(bx, {sahte: true, on: true, emin: true}); st.sel = null; if (st.ask === 'n') st.ask = null; needOkey(); summary(); }
    else if (a === 'toggle' && bx) { bx.on = !bx.on; st.sel = null; summary(); }
    else if (a === 'clear') resetScan();
    else if (a === 'sn') {
      const k = +b.dataset.k; st.ask = null;
      if (k) {
        let left = k;
        for (const x of st.boxes) if (left > 0 && x.on && !x.sahte && x.n == null) { x.sahte = true; left--; }
        st.vS = left; needOkey(); summary();
        if (left) st.msg += ' Sahte okey bir sayı gibi okunduysa o kutuya dokunup “Sahte okey” seç.';
      }
    }
    else if (a === 'okey') setOkey(+b.dataset.n);
    else if (a === 'nosahte') { st.boxes.forEach(x => { if (x.sahte) { x.sahte = false; } }); st.vS = 0; st.ask = null; summary(); }
    else if (a === 'chgokey') { st.ask = 'v'; st.askK = sahteN(); }
    else if (a === 'stop') { if (st.ctl) st.ctl.abort(); if (eng === 'web') { st.busy = false; st.ctl = null; } else if (eng === 'native') { if (nativePending) nativePending.rej({code: 'cancelled'}); nativePending = null; } else return; }
    else if (a === 'photo') { pickFile(true, runClaude); return; }
    else if (a === 'wcam' || a === 'wgal') { pickFile(a === 'wcam', runWeb); return; }
    else if (a === 'ncam' || a === 'ngal') { runNative(a === 'ncam' ? 'camera' : 'gallery'); return; }
    else if (a === 'use') { if (st.ask === 'v' && sahteN()) { toast('Önce okeyin kaç olduğunu seç'); return; } closeSheet(s); onUse(sum()); return; }
    else if (a === 'send') {
      if (st.ask === 'v' && sahteN()) { toast('Önce okeyin kaç olduğunu seç'); return; }
      if (myIdx() == null) { openMe(); return; }
      if (sendClaim(sum())) { closeSheet(s); toast('Gönderildi. Yazbozcu el girerken görecek.'); } else toast('Gönderilemedi. Sayıyı yazbozcuya söyle.');
      return;
    }
    draw();
  });
  s.redraw = draw;
  draw();
}

  });

function showOnb() {
  const o = $('#onb'); let i = 0;
  const draw = () => {
    const c = ONB[i];
    o.innerHTML = `<div class="ob"><div class="ob-top">${i < ONB.length - 1 ? '<button class="btn sm ghost" data-o="skip">Geç</button>' : ''}</div>
      <div class="ob-art">${sv(c.art)}</div><h2>${c.t}</h2><p>${c.p}</p>
      <div class="ob-dots">${ONB.map((x, j) => `<i class="${j === i ? 'on' : ''}"></i>`).join('')}</div>
      <div class="row2" style="margin-top:0">${i > 0 ? '<button class="btn" data-o="prev">Geri</button>' : '<span></span>'}<button class="btn pri" data-o="next">${i < ONB.length - 1 ? 'İleri' : 'Başla'}</button></div></div>`;
  };
  o.onclick = e => {
    const a = e.target.closest('[data-o]')?.dataset.o; if (!a) return;
    if (a === 'prev') { i = Math.max(0, i - 1); draw(); return; }
    if (a === 'next' && i < ONB.length - 1) { i++; draw(); return; }
    o.hidden = true; o.innerHTML = ''; prefs.onboarded = true; savePrefs(); navSync();

/* ---------- Kazanan: konfeti ---------- */
let winSeen = '';
function winners(g) { const t = totals(g), m = Math.min(...t); return {idx: t.map((v, i) => v === m ? i : -1).filter(i => i >= 0), score: m}; }
function celebrate(g, then) {
  const key = g.code + ':' + totalHands(g) + ':' + g.done;
  if (winSeen === key) { if (then) then(); return; }
  winSeen = key;
  closeAll();
  const w = winners(g), names = w.idx.map(i => sideName(g, i));
  const el = $('#win');
  el.innerHTML = `<canvas></canvas><div class="wc" role="dialog" aria-label="Kazanan">
      <div class="wt">${ic('trophy')}</div><small>${w.idx.length > 1 ? 'Berabere' : 'Kazanan'}</small>
      <div class="wtiles">${w.idx.map(i => tb(g, i, 'lg')).join('')}</div>
      <b>${esc(names.join(' ve '))}</b><span class="num">${fmt(w.score)}</span>
      <button class="btn pri wide" data-w="ok">${then ? 'Sonuçlar' : 'Tamam'}</button></div>`;
  el.hidden = false; navSync();
  const done = () => { if (el.hidden) return; stop(); el.hidden = true; el.innerHTML = ''; navSync(); if (then) then(); };
  el.onclick = e => { if (e.target.closest('[data-w]') || e.target === el.querySelector('canvas')) done(); };
  el._close = done;
  const stop = confetti(el.querySelector('canvas'));
}
function confetti(cv) {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return () => {};
  const ctx = cv.getContext('2d'), dpr = Math.min(2, window.devicePixelRatio || 1);
  const size = () => { cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; };
  size(); addEventListener('resize', size);
  const cols = ['#d23a2b', '#2a63da', '#d98f00', '#1b1d21', '#f2c14e', '#3ddc84', '#fbf6ea'];
  const P = [], N = 170, W = () => cv.width, H = () => cv.height;
  const burst = (x, dir) => { for (let i = 0; i < N / 2; i++) P.push({x, y: H() * .72, vx: dir * (4 + Math.random() * 9) * dpr, vy: -(10 + Math.random() * 11) * dpr,
    r: (4 + Math.random() * 5) * dpr, c: cols[(Math.random() * cols.length) | 0], a: Math.random() * 6, va: (Math.random() - .5) * .35, s: Math.random() < .3 ? 1 : 0, life: 0}); };
  burst(0, 1); burst(W(), -1);
  let raf = 0, t0 = performance.now(), more = 1;
  const tick = now => {
    ctx.clearRect(0, 0, W(), H());
    if (more && now - t0 > 900) { more = 0; for (let i = 0; i < 70; i++) P.push({x: Math.random() * W(), y: -20 * dpr, vx: (Math.random() - .5) * 2 * dpr, vy: (2 + Math.random() * 3) * dpr, r: (4 + Math.random() * 4) * dpr, c: cols[(Math.random() * cols.length) | 0], a: Math.random() * 6, va: (Math.random() - .5) * .3, s: Math.random() < .3 ? 1 : 0, life: 0}); }
    for (const p of P) {
      p.vy += .32 * dpr; p.vx *= .985; p.vy *= .985; p.x += p.vx + Math.sin(p.a) * .6 * dpr; p.y += p.vy; p.a += p.va; p.life++;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c;
      if (p.s) { ctx.beginPath(); ctx.arc(0, 0, p.r * .55, 0, 7); ctx.fill(); } else ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2 * (1 + Math.abs(Math.sin(p.a * 2))));
      ctx.restore();
    }
    for (let i = P.length - 1; i >= 0; i--) if (P[i].y > H() + 40) P.splice(i, 1);
    if (P.length && now - t0 < 7000) raf = requestAnimationFrame(tick); else ctx.clearRect(0, 0, W(), H());
  };
  raf = requestAnimationFrame(tick);
  return () => { cancelAnimationFrame(raf); removeEventListener('resize', size); };
}

/* ---------- İlk oyunda ipuçları ---------- */
function coachSteps() {
  const live = !NATIVE || liveReady();
  return [
    {sel: '[data-act="el"]', t: 'El bitince buraya bas', p: 'Oyuncuyu seç, 202 ya da Biter gibi hazır değere dokun veya sayıyı yaz. Seçince sıradaki oyuncuya geçer.'},
    {sel: '[data-act="ceza"]', t: 'Ceza için buraya bas', p: 'İşlek attı, okeyi attı… Kime olduğunu seç, 101 yazılır. Cezalar tablonun en altındaki Ceza satırında durur.'},
    {sel: '[data-act="odul"]', t: 'Rekor açıldıysa buraya bas', p: 'Rekor ya da çift rekor seç. Rekor, oyuncunun adının yanında + olarak görünür.'},
    {sel: '[data-act="share"]', t: 'Masayla paylaş', p: live ? 'Masadakiler QR’ı okutsun, skoru kendi telefonlarından canlı izlesinler.' : 'Skoru kopyalayıp gönderebilirsin. Site kurulunca QR ile canlı izleme de açılır.'},
    {sel: '#top [data-act="undo"]', pad: 4, t: 'Yanlış mı yazdın?', p: 'Bu tuş son yazılanı geri alır. Yanındaki kalemle eski kayıtları düzeltirsin; tablodaki bir sayıya dokunmak da düzeltmeyi açar.', box: ['#top [data-act="undo"]', '#top [data-act="edit"]']},
    {sel: '#top [data-act="eye"]', pad: 4, t: 'Toplamları gizle ya da göster', p: 'Gizliyse toplamlar son elden önce kendiliğinden açılır. Kurallar ve ayarlar sağdaki menüde.'}
  ];
}
let coachI = 0;
function showCoach() {
  if (role === 'viewer' || view !== 'game' || !game) return;
  closeAll();
  coachI = 0; const c = $('#coach'); c.hidden = false;
  c.onclick = e => { const a = e.target.closest('[data-c]')?.dataset.c; if (a === 'skip') endCoach(); else if (a === 'next') { coachI++; drawCoach(); } };
  drawCoach(); navSync();
}
function drawCoach() {
  const c = $('#coach'), steps = coachSteps();
  while (coachI < steps.length && !$(steps[coachI].sel)) coachI++;
  if (coachI >= steps.length) { endCoach(); return; }
  const st = steps[coachI], rs = (st.box || [st.sel]).map(q => $(q)).filter(Boolean).map(el => el.getBoundingClientRect());
  const pad = st.pad ?? 6, L = Math.min(...rs.map(r => r.left)) - pad, T = Math.min(...rs.map(r => r.top)) - pad,
    R = Math.max(...rs.map(r => r.right)) + pad, B = Math.max(...rs.map(r => r.bottom)) + pad;
  const below = (T + B) / 2 < innerHeight / 2, last = coachI === steps.length - 1;
  c.innerHTML = `<div class="ring" style="left:${L}px;top:${T}px;width:${R - L}px;height:${B - T}px"></div>
    <div class="bub" role="dialog" aria-label="İpucu" style="${below ? `top:${B + 14}px` : `bottom:${innerHeight - T + 14}px`}"><small>İPUCU ${coachI + 1}/${steps.length}</small><b>${esc(st.t)}</b><p>${esc(st.p)}</p>
    <div class="cb">${last ? '<span></span>' : '<button class="sk" data-c="skip">Geç</button>'}<button class="nx" data-c="next">${last ? 'Anladım' : 'İleri'}</button></div></div>`;
}
function endCoach() { const c = $('#coach'); c.hidden = true; c.innerHTML = ''; prefs.coached = true; savePrefs(); navSync(); }
window.addEventListener('resize', () => { if (!$('#coach').hidden) drawCoach(); });

/* ---------- yetenekler (Claude) ---------- */
async function initCaps() {
  const C = window.claude;
  if (!C || typeof C.use !== 'function') {
    CFG = await loadConfig();
    let c = cfgOK(CFG) ? CFG : LS.get('yb.cfg', null);
    if (!cfgOK(c) && pendingSite) { try { c = await fetchSiteConfig(pendingSite); } catch (e) { c = null; } }
    // Mağaza sürümü: canlı paylaşım ayarlarını kendi sitesinden kendiliğinden alır (internet yoksa bir dahaki açılışta)
    if (!cfgOK(c) && NATIVE) { try { c = await fetchSiteConfig((CFG && CFG.siteUrl) || SITE_HOME); } catch (e) { c = null; } }
    if (cfgOK(c)) await useFB(c);
    cap.ready = true; afterCaps(); return;
  }
  const use = n => Promise.resolve().then(() => C.use(n)).catch(() => null);
  const [user, db, room, sample] = await Promise.all([use('user'), use('db'), use('room'), use('sample')]);
  Object.assign(cap, {user, db, room, sample});
  if (user && typeof user.id === 'function') { try { cap.uid = await user.id(); } catch (e) {} }
  if (sample && typeof sample.limits === 'function') { try { const l = await sample.limits(); cap.images = !!(l && l.images); cap.imgTypes = (l && l.images && l.images.mediaTypes) || null; } catch (e) {} }
  cap.ready = true;
  afterCaps();
}
async function afterCaps() {
  if (role === 'viewer') { watch(); return; }
  if (game && !game.sample) { if (cap.uid) game.adminId = cap.uid; pushNow(); joinRoomFor(game.code, true); }
  render(); refreshSheets();
  if (cap.db && cap.uid) {
    try {
      const snap = await cap.db.doc('data/users/' + cap.uid + '/prefs').get();
      if (snap.exists) {
        const d = clone(snap.data() || {});
        const ac = d.activeCode; delete d.activeCode; delete d.rules;
        if (!LS.get('yb.prefs', null)) { prefs = Object.assign(prefs, d); prefs.vals = fixVals(prefs.vals); LS.set('yb.prefs', prefs); curTheme = ''; applyTheme(); if (prefs.onboarded) $('#onb').hidden = true; }
        if (!game && role !== 'viewer' && ac) {
          const t = await cap.db.doc('tables/' + ac).get();
          if (t.exists) { const td = t.data(); if (td && td.adminId === cap.uid && td.game && !game) { game = migrate(clone(td.game)); role = 'admin'; LS.set('yb.game', game); render(); joinRoomFor(game.code, true); toast('Son oyunun ana menüde, Devam et ile açabilirsin'); } }
        }
      }
    } catch (e) {}
  }
}

/* ---------- başlat ---------- */
function start(data) {
  if (data && data.game !== undefined) { game = data.game; role = data.role || null; joinCode = data.joinCode || null; view = data.view || 'home'; }
  else view = game ? 'game' : 'home';
  game = migrate(game);
  if (!role && game) role = 'admin';
  setup = freshSetup();
  const dl = BOOT.yz ? parseDeepLink(BOOT.yz) : null;
  if (dl && dl.site) pendingSite = dl.site;
  if (BOOT.t || BOOT.yz) clearHash();
  const hc = dl ? dl.code : hashCode();
  if (hc) startViewer(hc);
  else if (role === 'viewer' && joinCode) startViewer(joinCode);
  else { if (role === 'viewer') role = game ? 'admin' : null; if (view === 'game' && !game) view = 'home'; render(); }
  if (!prefs.onboarded && role !== 'viewer') showOnb();
  window.addEventListener('hashchange', () => { const c = hashCode(); if (c && c !== joinCode) startViewer(c); });
  try { new MutationObserver(() => applyTheme()).observe(document.documentElement, {attributes: true, attributeFilter: ['data-theme']}); } catch (e) {}
  try { darkMQ && darkMQ.addEventListener('change', () => applyTheme()); } catch (e) {}
  initCaps();
}
if (window.claude && window.claude.hot && typeof window.claude.hot.snapshot === 'function') window.claude.hot.snapshot(() => ({game, role, joinCode, view}));
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start); else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
}
